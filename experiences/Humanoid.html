<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience: Humanoid</title>
    
    <link class="favicon" rel="icon" type="image/png" href="../images/gear_favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
        }
    </style>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="bg-zinc-50 dark:bg-[#121212] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-700 transition-colors duration-200">

    <header class="sticky top-0 z-50 bg-white/80 dark:bg-[#121212]/80 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800 transition-colors duration-200">
        <div class="max-w-3xl mx-auto px-6 h-12 flex items-center justify-start">
            <a href="../index.html" class="text-xs font-bold text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-50 transition flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
                </svg>
                Back to Home
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-8 min-h-[calc(100vh-3rem)]">
        <article class="space-y-5">
            
            <div class="space-y-2">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight sm:text-3xl text-zinc-900 dark:text-zinc-50">Humanoid</h1>
                    <h2 class="text-base font-semibold text-zinc-600 dark:text-zinc-400 mt-0.5">Mechanical Engineering Intern</h2>
                </div>
                
                <div class="flex flex-wrap items-center gap-2 text-[11px] font-bold text-zinc-400 uppercase tracking-wider">
                    <span>May 2026 — Present</span>
                    <span class="hidden sm:inline text-zinc-300 dark:text-zinc-600">•</span>
                    <span>Vancouver, BC</span>
                </div>
            </div>
            
            <hr class="border-zinc-200 dark:border-zinc-800 transition-colors">
            
            <div class="text-zinc-700 dark:text-zinc-300 font-medium text-base leading-relaxed">
                <p>
                    Incoming summer 2026. See what we're building <a href="https://thehumanoid.ai/" target="_blank" class="text-zinc-900 dark:text-zinc-50 font-bold underline decoration-zinc-300 dark:decoration-zinc-700 hover:decoration-zinc-900 dark:hover:decoration-zinc-400 transition-colors">here</a>.
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 py-1">
                <div class="aspect-square bg-zinc-100 dark:bg-zinc-800/30 rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800">
                    <img src="../images/experiences/LYRS_071.jpg" alt="Humanoid Pic 1" class="w-full h-full object-cover">
                </div>
                <div class="aspect-square bg-zinc-100 dark:bg-zinc-800/30 rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800">
                    <img src="../images/experiences/13112024_Warehouse_High Res_IT.jpg" alt="Humanoid Pic 2" class="w-full h-full object-cover">
                </div>
                
                <button 
                   data-video-id="44WPYlAvIK0"
                   aria-label="Watch Humanoid project demonstration video"
                   class="video-modal-trigger group relative aspect-square bg-zinc-100 dark:bg-zinc-800/30 rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800 block text-left w-full h-full transform transition-all duration-300 ease-out hover:scale-[1.02] hover:shadow-md cursor-pointer">
                    
                    <img src="https://img.youtube.com/vi/44WPYlAvIK0/maxresdefault.jpg" 
                         alt="Humanoid Demo Video Thumbnail" 
                         class="w-full h-full object-cover transition duration-300 group-hover:brightness-[0.85] dark:group-hover:brightness-75">
                    
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                        <div class="bg-black/40 backdrop-blur-sm p-4 rounded-full border border-white/20 text-white shadow-lg transform scale-95 group-hover:scale-100 transition-transform duration-300">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </button>
                
                <button 
                   data-video-id="Y2DhzLPGdwY"
                   aria-label="Watch Humanoid platform performance video"
                   class="video-modal-trigger group relative aspect-square bg-zinc-100 dark:bg-zinc-800/30 rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-800 block text-left w-full h-full transform transition-all duration-300 ease-out hover:scale-[1.02] hover:shadow-md cursor-pointer">
                    
                    <img src="https://img.youtube.com/vi/Y2DhzLPGdwY/maxresdefault.jpg" 
                         alt="Humanoid Performance Video Thumbnail" 
                         class="w-full h-full object-cover transition duration-300 group-hover:brightness-[0.85] dark:group-hover:brightness-75">
                    
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                        <div class="bg-black/40 backdrop-blur-sm p-4 rounded-full border border-white/20 text-white shadow-lg transform scale-95 group-hover:scale-100 transition-transform duration-300">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                    </div>
                </button>
            </div>
            
        </article>
    </main>

    <div id="videoModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-zinc-950/40 dark:bg-black/60 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div id="modalOutside" class="absolute inset-0 cursor-zoom-out"></div>
        
        <div class="relative w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-200/10 transform scale-95 transition-transform duration-300">
            <iframe 
                id="modalPlayer"
                src="" 
                title="YouTube video player"
                class="w-full h-full border-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <footer class="border-t border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#121212] transition-colors duration-200">
        <div class="max-w-3xl mx-auto px-6 py-5 text-center text-[11px] text-zinc-400 font-semibold tracking-wide">
            © 2026 Yang Lu. Built clean, with vibes.
        </div>
    </footer>

    <script>
        const modal = document.getElementById('videoModal');
        const outside = document.getElementById('modalOutside');
        const player = document.getElementById('modalPlayer');
        const triggers = document.querySelectorAll('.video-modal-trigger');

        function openModal(videoId) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
            
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0`;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('opacity-100');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                player.src = ""; // Instantly terminates video audio
            }, 300);
            document.body.style.overflow = '';
        }

        triggers.forEach(trigger => {
            trigger.addEventListener('click', () => {
                const videoId = trigger.getAttribute('data-video-id');
                openModal(videoId);
            });
        });

        outside.addEventListener('click', closeModal);
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });
    </script>

</body>
</html>
